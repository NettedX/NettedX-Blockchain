name: Docker Build & Deploy

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Docker Image
    runs-on: ubuntu-latest
    needs: docker

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Upload deployment files
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPC_HOST }}
        username: ${{ secrets.VPC_USERNAME }}
        password: ${{ secrets.VPC_PASSWORD }}
        source: ".env.example,docker-compose.prod.yml"
        target: "/opt/NettedX/NettedX-Blockchain"

    - name: Deploy to VPC
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VPC_HOST }}
        username: ${{ secrets.VPC_USERNAME }}
        password: ${{ secrets.VPC_PASSWORD }}
        script: |
          set -e

          cd /opt/NettedX/NettedX-Blockchain

          export VERSION="${{ github.event.release.tag_name }}"
          export VERSION="${VERSION#v}"

          export IMAGE=ghcr.io/nettedx/nettedx-blockchain:${VERSION}

          echo "Deploying ${IMAGE}"

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d

          docker compose -f docker-compose.prod.yml ps

          # =========================================================
          # Update backend .env with deployed contract addresses
          # =========================================================

          ADDRESS_FILE="/opt/NettedX/NettedX-Blockchain/address-data/addresses.json"
          ENV_FILE="/opt/NettedX/nettedx-back/.env"

          echo "Reading contract addresses from ${ADDRESS_FILE}"

          test -f "${ADDRESS_FILE}"

          python3 - "${ADDRESS_FILE}" "${ENV_FILE}" <<'PY'
          import json
          import os
          import sys
          import tempfile

          address_file = sys.argv[1]
          env_file = sys.argv[2]

          with open(address_file, "r") as f:
              addresses = json.load(f)

          keys = [
              "NETTEDX_MOCK_USDC_CONTRACT_ADDRESS",
              "NETTEDX_MOCK_BOND_CONTRACT_ADDRESS",
              "NETTEDX_SETTLEMENT_CONTRACT_ADDRESS",
              "NETTEDX_NETTING_CONTRACT_ADDRESS",
              "NETTEDX_LIQUIDITY_BUFFER_CONTRACT_ADDRESS",
          ]

          # Validate all required addresses exist
          for key in keys:
              if key not in addresses:
                  raise RuntimeError(
                      f"Missing {key} in {address_file}"
                  )

              if not addresses[key]:
                  raise RuntimeError(
                      f"Empty value for {key}"
                  )

          with open(env_file, "r") as f:
              lines = f.readlines()

          updated = set()
          result = []

          for line in lines:
              stripped = line.lstrip()

              if "=" in line and not stripped.startswith("#"):
                  key = line.split("=", 1)[0]

                  if key in addresses and key in keys:
                      result.append(f"{key}={addresses[key]}\n")
                      updated.add(key)
                      continue

              result.append(line)

          # Add missing keys
          for key in keys:
              if key not in updated:
                  result.append(f"{key}={addresses[key]}\n")

          # Atomic replacement of .env
          directory = os.path.dirname(os.path.abspath(env_file))

          fd, temp_file = tempfile.mkstemp(
              dir=directory,
              prefix=".env.",
              text=True,
          )

          try:
              with os.fdopen(fd, "w") as f:
                  f.writelines(result)

              os.replace(temp_file, env_file)
          except Exception:
              try:
                  os.unlink(temp_file)
              except FileNotFoundError:
                  pass
              raise

          print("Updated contract addresses:")

          for key in keys:
              print(f"{key}={addresses[key]}")
          PY

          echo "Backend .env updated successfully."

          # =========================================================
          # Restart backend service
          # =========================================================

          echo "Restarting backend service"
          cd /opt/NettedX/nettedx-back
          docker compose -f docker-compose.prod.yml restart
          docker compose -f docker-compose.prod.yml ps

          echo "Deployment completed successfully."