services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    container_name: ${ANVIL_CONTAINER_NAME}

    entrypoint:
      - anvil

    command:
      - --host
      - 0.0.0.0
      - --port
      - ${ANVIL_PORT}
      - --chain-id
      - ${ANVIL_CHAIN_ID}
      - --accounts
      - ${ANVIL_ACCOUNTS}
      - --balance
      - ${ANVIL_BALANCE}
      - --mnemonic
      - ${ANVIL_MNEMONIC}
      - --state
      - /anvil-data/anvil-state
      - --state-interval
      - "10"

    ports:
      - "${ANVIL_PORT}:${ANVIL_PORT}"

    volumes:
      - anvil-data:/anvil-data

    healthcheck:
      test:
        [
          "CMD",
          "cast",
          "block-number",
          "--rpc-url",
          "http://127.0.0.1:${ANVIL_PORT}"
        ]
      interval: 2s
      timeout: 3s
      retries: 10

  

volumes:
  anvil-data: